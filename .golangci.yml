version: "2"
run:
  concurrency: 4
  tests: true
linters:
  enable:
    - bodyclose
    - gocritic
    - gosec
    - makezero
    - misspell
    - modernize
    - nakedret
    - revive
    - errcheck
    - staticcheck
    - govet
    - ineffassign
    - intrange
    - unused
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
      - internal/githubv4mock
    rules:
      # v2.9.0 misreports SA4006 for Go 1.26 new(expr); retain go-github's helper until the linter is upgraded.
      - linters:
          - staticcheck
        text: '(go)?github\.Ptr is deprecated: use the new builtin instead\.'
      - linters:
          - revive
        text: "var-naming: avoid package names that conflict with Go standard library package names"
  settings:
    modernize:
      disable:
        - newexpr
    staticcheck:
      checks:
        - "all"
        - -QF1008
        - -ST1000
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
